# Tema base do Acervo DS — dark com acentos neon suaves.
# O refinamento visual (cards, navbar, glow) fica em app/tema.py.

[theme]
base = "dark"
primaryColor = "#a78bfa"
backgroundColor = "#0e0b16"
secondaryBackgroundColor = "#151021"
textColor = "#e9e4f7"
linkColor = "#7dd3fc"
codeBackgroundColor = "#131022"
borderColor = "#2c2344"
baseRadius = "0.75rem"

[browser]
gatherUsageStats = false
